spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    root: INFO
    com.scheduler: DEBUG
    org.springframework.amqp: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-N/A}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

server:
  servlet:
    context-path: /api

