<div class="error-container" role="alert">
  <div class="error-icon">
    <mat-icon>error_outline</mat-icon>
  </div>

  <h3>Unable to load data</h3>

  <p>{{ message() }}</p>

  <button mat-flat-button color="primary" (click)="retry.emit()">
    <mat-icon>refresh</mat-icon>
    Try Again
  </button>
</div>
